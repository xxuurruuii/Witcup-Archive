<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>作答 · 见联会存档</title>
<meta name="description" content="第5届见联会 Meant To Be A Witness Clone 2 题目的在线作答页面，可绘画、擦除并在同组题目间切换。">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 20'%3E%3Ccircle cx='7' cy='10' r='5' fill='%231e1e1e'/%3E%3Cpath d='M12 10h14' stroke='%231e1e1e' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/css/site.css">
</head>
<body class="puzzle-page" data-season="wc5">

<header class="puzzle-bar">
  <a class="back-link" href="index.html#puzzles" aria-label="返回第5届题目">← 第5届题目</a>
  <div class="puzzle-id">
    <span class="puzzle-name" id="puzzle-name">题目</span>
    <span class="puzzle-progress" id="puzzle-progress"></span>
  </div>
</header>

<div class="puzzle-area">
  <p class="puzzle-note" id="puzzle-note" hidden></p>

  <main class="stage" id="stage">
    <div class="canvas-wrap" id="canvas-wrap">
      <img id="puzzle-img" alt="">
      <canvas id="draw-canvas"></canvas>
    </div>

    <p class="stage-message" id="stage-message">正在载入题目…</p>
  </main>

  <button class="nav-arrow prev" id="prev" type="button" aria-label="上一题">‹</button>
  <button class="nav-arrow next" id="next" type="button" aria-label="下一题">›</button>
</div>

<div class="toolbar-row">
  <div class="toolbar" role="toolbar" aria-label="绘图工具">
    <button class="tool active" id="mode-draw" type="button" aria-pressed="true" aria-label="画笔">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/></svg>
      <span class="tool-label">画笔</span>
    </button>
    <button class="tool" id="mode-erase" type="button" aria-pressed="false" aria-label="橡皮">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 16 8.5-8.5a2 2 0 0 1 2.8 0l4.2 4.2a2 2 0 0 1 0 2.8L14 19H8z"/><path d="M21 19H9"/></svg>
      <span class="tool-label">橡皮</span>
    </button>

    <span class="tool-divider" aria-hidden="true"></span>
    <div class="swatches" id="swatches" role="group" aria-label="画笔颜色"></div>
    <span class="tool-divider" aria-hidden="true"></span>

    <label class="size-control" for="size">粗细
      <input type="range" id="size" min="2" max="30" step="1" value="8">
      <output id="size-value" for="size">8</output>
    </label>

    <span class="tool-divider" aria-hidden="true"></span>

    <button class="tool" id="undo" type="button" aria-label="撤销">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
      <span class="tool-label">撤销</span>
    </button>
    <button class="tool" id="clear" type="button" aria-label="清空">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="m19 6-1 14H6L5 6"/></svg>
      <span class="tool-label">清空</span>
    </button>
  </div>
</div>

<div class="brush-cursor" id="brush-cursor" aria-hidden="true"></div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/puzzle.js"></script>
</body>
</html>
